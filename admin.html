<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Zaki Ansyari</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/site.css"><style>.admin-wrap{width:min(850px,calc(100% - 32px));margin:45px auto 80px}.admin-card{background:#111827;border:1px solid #ffffff17;padding:25px;margin:15px 0}.admin-card h2{font:600 25px 'Playfair Display';color:#f2b900}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.admin-form label{font-size:12px;display:flex;flex-direction:column;gap:6px}.admin-form input,.admin-form textarea,.admin-form select{padding:11px;background:#080b12;color:white;border:1px solid #ffffff25;border-radius:5px;font:13px Poppins}.admin-form textarea,.admin-form button{grid-column:1/-1}.admin-form button{padding:12px;border:0;background:#f2b900;border-radius:5px;font:500 13px Poppins;cursor:pointer}.admin-list{display:grid;gap:8px}.row-item{padding:12px;border:1px solid #ffffff1a;display:flex;justify-content:space-between;gap:10px;font-size:12px}.muted{color:#aeb7c5;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.logout{background:transparent;border:1px solid #f2b900;color:#f2b900;padding:9px 13px;cursor:pointer}.tabs button.active{background:#f2b900;color:#080b12}.hide{display:none!important}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.admin-form textarea,.admin-form button{grid-column:auto}}</style></head><body><header class="navbar"><a class="logo" href="index.html">ZAKI ANSYARI</a><a href="index.html" style="color:#eee;font-size:12px">← Website</a></header><main class="admin-wrap"><h1 style="font:700 40px 'Playfair Display'">Admin <span style="color:#f2b900">Dashboard</span></h1><p class="muted">Kelola konten yang ditampilkan pada website dan tersimpan di Google Sheets.</p><section id="login" class="admin-card"><h2>Login admin</h2><p class="muted">Gunakan akun Google yang emailnya sudah didaftarkan pada Apps Script.</p><div id="googleButton"></div><p id="loginStatus" class="muted"></p></section><section id="dash" class="hide"><div class="admin-card" style="display:flex;justify-content:space-between;align-items:center"><div><h2>Dashboard</h2><p id="adminEmail" class="muted"></p></div><button id="logout" class="logout">Keluar</button></div><div class="tabs"><button class="active" data-tab="profile">Profil</button><button data-tab="gallery">Gallery</button><button data-tab="songs">Songs</button></div><section class="admin-card" id="tab-profile"><h2>Profil & kutipan</h2><form id="profileForm" class="admin-form"><label>Nama<input name="name" required></label><label>Foto profil URL HTTPS<input name="image" type="url"></label><label>Kutipan Home<textarea name="intro" required></textarea></label><label>Kutipan Songs<textarea name="quote"></textarea></label><label>Email kontak<input name="email" type="email"></label><label>WhatsApp URL<input name="whatsapp" type="url"></label><button>Simpan profil</button></form></section><section class="admin-card hide" id="tab-gallery"><h2>Tambah foto gallery</h2><form id="galleryForm" class="admin-form"><label>Judul foto<input name="title" required></label><label>URL gambar HTTPS<input name="image" type="url" required></label><button>Tambah foto</button></form><div id="galleryList" class="admin-list"></div></section><section class="admin-card hide" id="tab-songs"><h2>Tambah lagu</h2><form id="songForm" class="admin-form"><label>Judul lagu<input name="title" required></label><label>Artis<input name="artist" required></label><label>URL Spotify / SoundCloud<input name="url" type="url" required></label><button>Tambah lagu</button></form><div id="songsList" class="admin-list"></div></section><p id="adminStatus" class="muted"></p></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="assets/admin.js"></script></body></html>
